name: Criar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Compilar APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preparar projeto
        run: |
          rm -rf /tmp/outbreak
          mkdir -p /tmp/outbreak

          unzip -q OUTBREAK_ULTIMO_SOBREVIVENTE_Godot.zip -d /tmp/outbreak

          PROJECT_DIR="$(dirname "$(find /tmp/outbreak -name project.godot -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/project.godot" ]; then
            echo "ERRO: project.godot não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"

          cp export_presets.cfg "$PROJECT_DIR/export_presets.cfg"

          # Gera APK assinado com a chave de debug do container.
          sed -i 's|^package/signed=.*|package/signed=true|' "$PROJECT_DIR/export_presets.cfg"

          # Correção principal: no Godot 4.3, exportação Android exige ETC2/ASTC habilitado.
          if grep -q '^textures/vram_compression/import_etc2_astc=' "$PROJECT_DIR/project.godot"; then
            sed -i 's|^textures/vram_compression/import_etc2_astc=.*|textures/vram_compression/import_etc2_astc=true|' "$PROJECT_DIR/project.godot"
          elif grep -q '^\[rendering\]$' "$PROJECT_DIR/project.godot"; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "$PROJECT_DIR/project.godot"
          else
            printf '\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n' >> "$PROJECT_DIR/project.godot"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Godot para Android
        run: |
          mkdir -p ~/.config
          rm -rf ~/.config/godot

          cp -a /root/.config/godot ~/.config/godot

          mkdir -p ~/.local/share/godot/export_templates
          rm -rf ~/.local/share/godot/export_templates/4.3.stable

          cp -a \
            /root/.local/share/godot/export_templates/4.3.stable \
            ~/.local/share/godot/export_templates/4.3.stable

          test -f ~/.config/godot/editor_settings-4.3.tres
          test -d ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/debug.keystore

          echo "Ambiente Godot Android preparado."

      - name: Instalar Android SDK 34
        run: |
          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="/usr/lib/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest"

          echo "Android SDK configurado."

      - name: Verificar configuração Android
        run: |
          cd "$PROJECT_DIR"

          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="/usr/lib/android-sdk"

          test -f project.godot
          test -f export_presets.cfg

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=false' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg
          grep -q '^package/signed=true$' export_presets.cfg
          grep -q '^textures/vram_compression/import_etc2_astc=true$' project.godot

          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -f /root/debug.keystore

          echo "Configuração Android OK."

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"

          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="/usr/lib/android-sdk"
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="/root/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          mkdir -p build/android

          echo "Iniciando exportação do APK..."

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "build/android/OUTBREAK_ULTIMO_SOBREVIVENTE.apk"

      - name: Verificar APK
        if: success()
        run: |
          cd "$PROJECT_DIR"

          test -f "build/android/OUTBREAK_ULTIMO_SOBREVIVENTE.apk"

          echo "========================================"
          echo "APK GERADO COM SUCESSO!"
          echo "========================================"

          ls -lh build/android/OUTBREAK_ULTIMO_SOBREVIVENTE.apk

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OUTBREAK-ULTIMO-SOBREVIVENTE-APK
          path: ${{ env.PROJECT_DIR }}/build/android/OUTBREAK_ULTIMO_SOBREVIVENTE.apk
          if-no-files-found: error
